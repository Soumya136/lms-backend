version: '3.8'

services:
  db:
    image: ankane/pgvector:latest
    container_name: ai_lms_db
    environment:
      POSTGRES_USER: lms_user
      POSTGRES_PASSWORD: lms_password
      POSTGRES_DB: lms_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: ai_lms_redis
    ports:
      - "6379:6379"
    restart: always

volumes:
  postgres_data: